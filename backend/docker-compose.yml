services:
  postgres:
    image: postgres:16-alpine
    container_name: cropvibe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cropvibe
      POSTGRES_PASSWORD: cropvibe
      POSTGRES_DB: cropvibe
    ports:
      - "5432:5432"
    volumes:
      - cropvibe_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cropvibe"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cropvibe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cropvibe_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cropvibe_pg:
  cropvibe_redis:
