name: Deploy demo to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: SPA fallback for client routes
        run: cp dist/index.html dist/404.html

      - name: Install admin console
        working-directory: admin
        run: npm ci

      - name: Build admin console (static demo)
        working-directory: admin
        run: npm run build:static
        env:
          BASE_PATH: /${{ github.event.repository.name }}/admin

      - name: Add admin console to the site
        run: cp -r admin/out dist/admin

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
